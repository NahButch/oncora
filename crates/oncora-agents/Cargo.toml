[package]
name = "oncora-agents"
description = "Agent runtime: planner/specialist/verifier loop and the Platform assembly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Run the agent loop against a real qdrant-backed VectorStore (E2E test).
qdrant = ["oncora-retrieval/qdrant"]
# Real LLM inference via an OpenAI-compatible endpoint (Ollama, vLLM, TGI).
openai = ["dep:async-openai"]

[dependencies]
oncora-core.workspace = true
oncora-memory.workspace = true
oncora-retrieval.workspace = true
oncora-kg.workspace = true
oncora-mcp-host.workspace = true
oncora-uncertainty.workspace = true
oncora-artifacts.workspace = true
oncora-telemetry.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

# async-openai 0.40 is heavily feature-gated: `chat-completion` pulls the
# client/config/chat types (via `_api`); `rustls` wires reqwest's TLS backend.
async-openai = { version = "0.40", default-features = false, features = [
    "chat-completion",
    "rustls",
], optional = true }

[dev-dependencies]
tokio.workspace = true

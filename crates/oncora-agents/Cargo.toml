[package]
name = "oncora-agents"
description = "Agent runtime: planner/specialist/verifier loop and the Platform assembly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Run the agent loop against a real qdrant-backed VectorStore (E2E test).
qdrant = ["oncora-retrieval/qdrant"]
# Real LLM inference + embeddings via an OpenAI-compatible endpoint (Ollama, vLLM, TGI).
openai = ["dep:async-openai"]
# Real graph backend (Oxigraph), real MCP tool host (rmcp), persistent memory (redb).
oxigraph-graph = ["oncora-kg/oxigraph"]
rmcp-tools = ["oncora-mcp-host/rmcp"]
redb-mem = ["oncora-memory/redb"]
# Everything real at once: embeddings + vectors + graph + tools + model + memory.
e2e = ["qdrant", "openai", "oxigraph-graph", "rmcp-tools", "redb-mem"]

[dependencies]
oncora-core.workspace = true
oncora-memory.workspace = true
oncora-retrieval.workspace = true
oncora-kg.workspace = true
oncora-mcp-host.workspace = true
oncora-uncertainty.workspace = true
oncora-artifacts.workspace = true
oncora-telemetry.workspace = true
# In-memory ledger by default (no native deps); the bench swaps in SQLite.
oncora-ledger.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

# async-openai 0.40 is heavily feature-gated: `chat-completion` pulls the
# client/config/chat types (via `_api`); `rustls` wires reqwest's TLS backend.
async-openai = { version = "0.40", default-features = false, features = [
    "chat-completion",
    "embedding",
    "rustls",
], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
anyhow.workspace = true
serde_json.workspace = true

# The benchmark/ingest harness needs the real backends behind the feature seams.
oncora-retrieval = { workspace = true, features = ["qdrant"] }
oncora-kg = { workspace = true, features = ["oxigraph"] }
oncora-memory = { workspace = true, features = ["redb"] }
oncora-mcp-host = { workspace = true, features = ["rmcp"] }
# Ledger seam: both SQLite backends compiled so the bench picks one at runtime.
oncora-ledger = { workspace = true, features = ["sqlite-c", "sqlite-rust"] }

[[example]]
name = "bench"
required-features = ["e2e"]

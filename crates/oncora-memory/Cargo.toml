[package]
name = "oncora-memory"
description = "Agent memory architecture: five memory types with write/consolidation and hybrid read"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Persistent agent memory backed by redb (pure-Rust embedded ACID KV store).
redb = ["dep:redb", "dep:serde_json"]

[dependencies]
oncora-core.workspace = true
oncora-kg.workspace = true
oncora-retrieval.workspace = true
oncora-artifacts.workspace = true
async-trait.workspace = true

redb = { version = "2", optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true

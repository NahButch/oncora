name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Test ledger backends (C + Rust SQLite)
        run: cargo test -p oncora-ledger --features "sqlite-c sqlite-rust"
      - name: Test MCP transport (rmcp loopback)
        run: cargo test -p oncora-mcp-host --features rmcp
      - name: Build (release)
        run: cargo build --workspace --release

  # Integration test that needs a real qdrant — testcontainers starts it in
  # Docker (available on GitHub-hosted ubuntu runners). Kept in its own job so
  # the core build stays free of any service dependency.
  qdrant-it:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (qdrant feature)
        run: cargo clippy -p oncora-retrieval --features qdrant --all-targets -- -D warnings
      - name: Integration test (qdrant via testcontainers)
        run: cargo test -p oncora-retrieval --features qdrant

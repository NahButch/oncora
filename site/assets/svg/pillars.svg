<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" role="img" aria-label="The four pillars: multimodal reasoning, agent memory, robustness and uncertainty, reliability and benchmarking" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="pteal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
    <linearGradient id="pblue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="pviolet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <linearGradient id="pgreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#10b981"/></linearGradient>
    <filter id="ps" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/></filter>
  </defs>

  <!-- card 1 multimodal -->
  <g filter="url(#ps)"><rect x="14" y="20" width="280" height="200" rx="16" fill="#13233c" stroke="url(#pteal)" stroke-opacity="0.6"/></g>
  <circle cx="54" cy="60" r="20" fill="#0f1d33" stroke="url(#pteal)" stroke-width="2"/>
  <g transform="translate(54 60)" stroke="url(#pteal)" stroke-width="2.4" fill="none"><rect x="-9" y="-9" width="8" height="8" rx="2"/><circle cx="5" cy="-5" r="4"/><path d="M-9 5 h18" /><path d="M-9 9 h12"/></g>
  <text x="86" y="56" fill="#e6edf6" font-size="17" font-weight="700">01 · Multimodal</text>
  <text x="86" y="76" fill="#e6edf6" font-size="17" font-weight="700">reasoning</text>
  <text x="34" y="118" fill="#9fb3c8" font-size="13">Reason across text,</text>
  <text x="34" y="138" fill="#9fb3c8" font-size="13">omics, imaging and</text>
  <text x="34" y="158" fill="#9fb3c8" font-size="13">a biomolecular KG.</text>
  <text x="34" y="196" fill="#5fb9ae" font-size="12">qdrant · oxigraph · cozo</text>

  <!-- card 2 memory -->
  <g filter="url(#ps)"><rect x="310" y="20" width="280" height="200" rx="16" fill="#13233c" stroke="url(#pviolet)" stroke-opacity="0.6"/></g>
  <circle cx="350" cy="60" r="20" fill="#0f1d33" stroke="url(#pviolet)" stroke-width="2"/>
  <g transform="translate(350 60)" stroke="url(#pviolet)" stroke-width="2.4" fill="none"><circle cx="0" cy="0" r="9"/><path d="M-5 -2 h10 M-5 2 h10 M0 -9 v18"/></g>
  <text x="382" y="56" fill="#e6edf6" font-size="17" font-weight="700">02 · Agent</text>
  <text x="382" y="76" fill="#e6edf6" font-size="17" font-weight="700">memory</text>
  <text x="330" y="118" fill="#9fb3c8" font-size="13">Working, episodic,</text>
  <text x="330" y="138" fill="#9fb3c8" font-size="13">semantic, procedural</text>
  <text x="330" y="158" fill="#9fb3c8" font-size="13">+ provenance memory.</text>
  <text x="330" y="196" fill="#b09bf0" font-size="12">cross-session · versioned</text>

  <!-- card 3 uncertainty -->
  <g filter="url(#ps)"><rect x="606" y="20" width="280" height="200" rx="16" fill="#13233c" stroke="url(#pgreen)" stroke-opacity="0.6"/></g>
  <circle cx="646" cy="60" r="20" fill="#0f1d33" stroke="url(#pgreen)" stroke-width="2"/>
  <g transform="translate(646 60)" stroke="url(#pgreen)" stroke-width="2.4" fill="none"><path d="M-9 6 a9 9 0 1 1 18 0"/><path d="M0 6 v-9"/><circle cx="0" cy="9" r="1.6" fill="url(#pgreen)"/></g>
  <text x="678" y="56" fill="#e6edf6" font-size="17" font-weight="700">03 · Robustness</text>
  <text x="678" y="76" fill="#e6edf6" font-size="17" font-weight="700">&amp; uncertainty</text>
  <text x="626" y="118" fill="#9fb3c8" font-size="13">Typed calibrated</text>
  <text x="626" y="138" fill="#9fb3c8" font-size="13">confidence; abstain</text>
  <text x="626" y="158" fill="#9fb3c8" font-size="13">or escalate, not guess.</text>
  <text x="626" y="196" fill="#5fc99f" font-size="12">conformal · ECE · oracles</text>

  <!-- card 4 reliability -->
  <g filter="url(#ps)"><rect x="902" y="20" width="284" height="200" rx="16" fill="#13233c" stroke="url(#pblue)" stroke-opacity="0.6"/></g>
  <circle cx="942" cy="60" r="20" fill="#0f1d33" stroke="url(#pblue)" stroke-width="2"/>
  <g transform="translate(942 60)" stroke="url(#pblue)" stroke-width="2.4" fill="none" stroke-linecap="round"><path d="M-9 7 L-3 -1 L1 3 L9 -7"/><path d="M4 -7 h5 v5"/></g>
  <text x="974" y="56" fill="#e6edf6" font-size="17" font-weight="700">04 · Reliability</text>
  <text x="974" y="76" fill="#e6edf6" font-size="17" font-weight="700">&amp; benchmarks</text>
  <text x="922" y="118" fill="#9fb3c8" font-size="13">Scored vs human</text>
  <text x="922" y="138" fill="#9fb3c8" font-size="13">experts &amp; baselines,</text>
  <text x="922" y="158" fill="#9fb3c8" font-size="13">reproducible to publish.</text>
  <text x="922" y="196" fill="#7fb4f6" font-size="12">golden sets · CI gates</text>
</svg>

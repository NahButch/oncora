<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" role="img" aria-label="Ingestion pipeline: sources normalize embed index graph" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="ib" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f1d33"/><stop offset="1" stop-color="#13233c"/></linearGradient>
    <marker id="iar" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7dd3fc"/></marker>
  </defs>
  <rect width="1200" height="200" rx="14" fill="url(#ib)"/>
  <g font-size="12" text-anchor="middle">
    <g><rect x="30" y="34" width="150" height="30" rx="9" fill="#13233c" stroke="#2dd4bf"/><text x="105" y="54" fill="#cfe9e4">Literature</text></g>
    <g><rect x="30" y="72" width="150" height="30" rx="9" fill="#13233c" stroke="#60a5fa"/><text x="105" y="92" fill="#cfe0ff">Multi-omics</text></g>
    <g><rect x="30" y="110" width="150" height="30" rx="9" fill="#13233c" stroke="#a78bfa"/><text x="105" y="130" fill="#e0d8ff">DICOM imaging</text></g>
    <g><rect x="30" y="148" width="150" height="30" rx="9" fill="#13233c" stroke="#fbbf24"/><text x="105" y="168" fill="#ffe9bf">Ontologies</text></g>
  </g>
  <g font-size="13" text-anchor="middle" font-weight="600">
    <g><rect x="240" y="78" width="130" height="46" rx="12" fill="#13233c" stroke="#2dd4bf"/><text x="305" y="100" fill="#cfe9e4">Normalize</text><text x="305" y="116" fill="#8fa6bd" font-size="10.5">swiftide</text></g>
    <g><rect x="410" y="78" width="130" height="46" rx="12" fill="#13233c" stroke="#60a5fa"/><text x="475" y="100" fill="#cfe0ff">Embed</text><text x="475" y="116" fill="#8fa6bd" font-size="10.5">candle / ort</text></g>
    <g><rect x="580" y="50" width="150" height="44" rx="12" fill="#13233c" stroke="#34d399"/><text x="655" y="71" fill="#a7f3d0">Index</text><text x="655" y="86" fill="#8fa6bd" font-size="10.5">qdrant · lancedb</text></g>
    <g><rect x="580" y="108" width="150" height="44" rx="12" fill="#13233c" stroke="#fbbf24"/><text x="655" y="129" fill="#ffe9bf">Graph</text><text x="655" y="144" fill="#8fa6bd" font-size="10.5">oxigraph · cozo</text></g>
  </g>
  <g stroke="#7dd3fc" stroke-width="2" fill="none" opacity="0.8">
    <path d="M180 49 C 210 60, 215 90, 240 96" marker-end="url(#iar)"/>
    <path d="M180 87 C 210 92, 215 98, 240 100" marker-end="url(#iar)"/>
    <path d="M180 125 C 210 116, 215 106, 240 104" marker-end="url(#iar)"/>
    <path d="M180 163 C 210 140, 215 112, 240 108" marker-end="url(#iar)"/>
    <path d="M370 101 H410" marker-end="url(#iar)"/>
    <path d="M540 95 C 560 84, 565 78, 580 74" marker-end="url(#iar)"/>
    <path d="M540 107 C 560 118, 565 124, 580 128" marker-end="url(#iar)"/>
  </g>
  <!-- snapshot store -->
  <g transform="translate(800 60)">
    <ellipse cx="60" cy="12" rx="60" ry="12" fill="#3b82f6"/>
    <path d="M0 12 V64 a60 12 0 0 0 120 0 V12" fill="#13233c" stroke="#60a5fa" stroke-opacity="0.6"/>
    <ellipse cx="60" cy="12" rx="60" ry="12" fill="none" stroke="#60a5fa"/>
    <text x="60" y="42" fill="#cfe0ff" font-size="12.5" text-anchor="middle" font-weight="600">Snapshot store</text>
    <text x="60" y="60" fill="#8fa6bd" font-size="10.5" text-anchor="middle">content-addressed</text>
  </g>
  <g transform="translate(960 78)" font-size="12.5">
    <text x="0" y="0" fill="#cfe9e4" font-weight="600">Pinned + reproducible</text>
    <text x="0" y="22" fill="#8fa6bd">· BLAKE3 hashes</text>
    <text x="0" y="42" fill="#8fa6bd">· provenance per claim</text>
    <text x="0" y="62" fill="#8fa6bd">· no writes to source</text>
  </g>
  <g stroke="#7dd3fc" stroke-width="2" fill="none" opacity="0.7"><path d="M730 96 C 760 80, 770 76, 800 74" marker-end="url(#iar)"/></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" role="img" aria-label="Architecture: planner, domain specialists, verifier and uncertainty scorer over an MCP tool host" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="ab" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f1d33"/><stop offset="1" stop-color="#13233c"/></linearGradient>
    <linearGradient id="at" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
    <marker id="aar" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7dd3fc"/></marker>
  </defs>
  <rect width="1200" height="200" rx="14" fill="url(#ab)"/>
  <g font-size="13" text-anchor="middle" font-weight="600">
    <g><rect x="40" y="78" width="150" height="46" rx="12" fill="#13233c" stroke="url(#at)"/><text x="115" y="106" fill="#e6edf6">Planner</text></g>
    <g><rect x="250" y="40" width="160" height="40" rx="11" fill="#13233c" stroke="#60a5fa"/><text x="330" y="65" fill="#cfe0ff">Genomics agent</text></g>
    <g><rect x="250" y="92" width="160" height="40" rx="11" fill="#13233c" stroke="#a78bfa"/><text x="330" y="117" fill="#e0d8ff">Literature agent</text></g>
    <g><rect x="250" y="144" width="160" height="40" rx="11" fill="#13233c" stroke="#fbbf24"/><text x="330" y="169" fill="#ffe9bf">Imaging agent</text></g>
    <g><rect x="470" y="78" width="150" height="46" rx="12" fill="#13233c" stroke="#34d399"/><text x="545" y="106" fill="#a7f3d0">Verifier</text></g>
    <g><rect x="680" y="78" width="170" height="46" rx="12" fill="#13233c" stroke="#fb7185"/><text x="765" y="100" fill="#ffd6dd">Uncertainty</text><text x="765" y="116" fill="#8fa6bd" font-size="11">scorer</text></g>
    <g><rect x="910" y="78" width="150" height="46" rx="12" fill="#13233c" stroke="url(#at)"/><text x="985" y="106" fill="#e6edf6">Responder</text></g>
  </g>
  <!-- MCP host strip -->
  <rect x="250" y="-1" width="810" height="0" />
  <rect x="40" y="0" width="0" height="0"/>
  <g stroke="#7dd3fc" stroke-width="2" fill="none" opacity="0.8">
    <path d="M190 95 L250 60" marker-end="url(#aar)"/>
    <path d="M190 101 L250 112" marker-end="url(#aar)"/>
    <path d="M190 110 L250 164" marker-end="url(#aar)"/>
    <path d="M410 60 L470 95" marker-end="url(#aar)"/>
    <path d="M410 112 L470 101" marker-end="url(#aar)"/>
    <path d="M410 164 L470 108" marker-end="url(#aar)"/>
    <path d="M620 101 L680 101" marker-end="url(#aar)"/>
    <path d="M850 101 L910 101" marker-end="url(#aar)"/>
  </g>
  <text x="600" y="26" fill="#6b8199" font-size="12" text-anchor="middle" letter-spacing="2">PLANNER → SPECIALISTS → VERIFIER → SCORER → RESPONDER</text>
</svg>

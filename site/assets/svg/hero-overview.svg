<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" role="img" aria-labelledby="heroTitle heroDesc" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
  <title id="heroTitle">Oncora platform overview</title>
  <desc id="heroDesc">Public oncology publications and multimodal data flow into the Oncora engine, through ingestion, embeddings, knowledge graph, agent memory, agent runtime and an uncertainty layer, then out to vector and graph databases, an on-prem AI model, and a cited confidence-scored answer for the scientist.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f1d33"/>
    </linearGradient>
    <linearGradient id="engine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16243d"/>
      <stop offset="1" stop-color="#111d31"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#10b981"/></linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#f43f5e"/></linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#7dd3fc"/></marker>
    <marker id="arrowg" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#34d399"/></marker>
  </defs>

  <rect width="1280" height="620" fill="url(#bg)"/>
  <rect width="1280" height="620" fill="none"/>

  <!-- ===================== INPUTS ===================== -->
  <text x="150" y="46" fill="#9fb3c8" font-size="15" letter-spacing="3" text-anchor="middle">INPUTS</text>

  <!-- publication stack -->
  <g filter="url(#soft)">
    <rect x="58" y="92" width="150" height="186" rx="10" fill="#1b2c46" transform="rotate(-7 133 185)"/>
    <rect x="66" y="84" width="150" height="186" rx="10" fill="#22344f" transform="rotate(-3 141 177)"/>
    <rect x="74" y="78" width="152" height="190" rx="10" fill="#eef4ff"/>
  </g>
  <g fill="#9fb3c8">
    <rect x="90" y="100" width="120" height="9" rx="4.5" fill="#3b82f6"/>
    <rect x="90" y="120" width="118" height="6" rx="3"/>
    <rect x="90" y="134" width="118" height="6" rx="3"/>
    <rect x="90" y="148" width="92" height="6" rx="3"/>
    <rect x="90" y="170" width="118" height="6" rx="3"/>
    <rect x="90" y="184" width="118" height="6" rx="3"/>
    <rect x="90" y="198" width="70" height="6" rx="3"/>
    <circle cx="120" cy="232" r="14" fill="none" stroke="#2dd4bf" stroke-width="3"/>
    <path d="M114 232 l5 5 l9 -11" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="150" y="236" fill="#475569" font-size="12">peer-reviewed</text>
  </g>
  <text x="150" y="300" fill="#e6edf6" font-size="15" font-weight="600" text-anchor="middle">Public oncology</text>
  <text x="150" y="320" fill="#e6edf6" font-size="15" font-weight="600" text-anchor="middle">publications</text>

  <!-- modality chips -->
  <g font-size="13" text-anchor="middle">
    <g filter="url(#soft)"><rect x="60" y="348" width="180" height="36" rx="18" fill="#16243d" stroke="#2dd4bf" stroke-opacity="0.5"/></g>
    <text x="150" y="371" fill="#cfe9e4">Literature / PubMed</text>
    <g filter="url(#soft)"><rect x="60" y="392" width="180" height="36" rx="18" fill="#16243d" stroke="#60a5fa" stroke-opacity="0.5"/></g>
    <text x="150" y="415" fill="#cfe0ff">Multi-omics / VCF</text>
    <g filter="url(#soft)"><rect x="60" y="436" width="180" height="36" rx="18" fill="#16243d" stroke="#a78bfa" stroke-opacity="0.5"/></g>
    <text x="150" y="459" fill="#e0d8ff">DICOM imaging</text>
    <g filter="url(#soft)"><rect x="60" y="480" width="180" height="36" rx="18" fill="#16243d" stroke="#fbbf24" stroke-opacity="0.5"/></g>
    <text x="150" y="503" fill="#ffe9bf">Bio-ontologies / KG</text>
  </g>

  <!-- input flow arrows into engine -->
  <g stroke="url(#flow)" stroke-width="6" fill="none" opacity="0.9">
    <path d="M232 200 C 280 210, 300 250, 360 255" marker-end="url(#arrow)"/>
    <path d="M246 366 C 300 360, 320 300, 360 290" marker-end="url(#arrow)"/>
    <path d="M246 454 C 300 440, 320 360, 360 330" marker-end="url(#arrow)"/>
  </g>
  <text x="300" y="232" fill="#7dd3fc" font-size="12" text-anchor="middle" transform="rotate(8 300 232)">snapshot + pin</text>

  <!-- ===================== ENGINE ===================== -->
  <g filter="url(#soft)">
    <rect x="362" y="74" width="556" height="472" rx="20" fill="url(#engine)" stroke="#2dd4bf" stroke-opacity="0.35" stroke-width="1.5"/>
  </g>
  <text x="640" y="106" fill="#e6edf6" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="1">ONCORA ENGINE</text>
  <text x="640" y="126" fill="#6b8199" font-size="12" text-anchor="middle">Rust-native · MCP tools · on-prem</text>

  <!-- sub-component cards -->
  <!-- Ingestion -->
  <g filter="url(#soft)"><rect x="386" y="146" width="158" height="74" rx="12" fill="#13233c" stroke="url(#teal)" stroke-width="1.5"/></g>
  <circle cx="412" cy="172" r="11" fill="url(#teal)"/><path d="M407 172 h10 M412 167 v10" stroke="#06302b" stroke-width="2.4" stroke-linecap="round"/>
  <text x="434" y="170" fill="#e6edf6" font-size="14" font-weight="600">Ingestion</text>
  <text x="434" y="188" fill="#8fa6bd" font-size="11">swiftide pipeline</text>
  <text x="434" y="206" fill="#6b8199" font-size="11">normalize · chunk</text>

  <!-- Embeddings -->
  <g filter="url(#soft)"><rect x="560" y="146" width="158" height="74" rx="12" fill="#13233c" stroke="url(#blue)" stroke-width="1.5"/></g>
  <circle cx="586" cy="172" r="11" fill="url(#blue)"/>
  <g stroke="#08213f" stroke-width="2"><path d="M581 172h10M586 167v10M582 168l8 8M590 168l-8 8"/></g>
  <text x="608" y="170" fill="#e6edf6" font-size="14" font-weight="600">Embeddings</text>
  <text x="608" y="188" fill="#8fa6bd" font-size="11">candle / ort</text>
  <text x="608" y="206" fill="#6b8199" font-size="11">on-prem vectors</text>

  <!-- Hybrid retrieval -->
  <g filter="url(#soft)"><rect x="734" y="146" width="160" height="74" rx="12" fill="#13233c" stroke="url(#green)" stroke-width="1.5"/></g>
  <circle cx="760" cy="172" r="11" fill="url(#green)"/><circle cx="760" cy="172" r="5" fill="none" stroke="#06311f" stroke-width="2"/><path d="M764 176l5 5" stroke="#06311f" stroke-width="2.4" stroke-linecap="round"/>
  <text x="782" y="170" fill="#e6edf6" font-size="14" font-weight="600">Hybrid retrieval</text>
  <text x="782" y="188" fill="#8fa6bd" font-size="11">vector + graph</text>
  <text x="782" y="206" fill="#6b8199" font-size="11">rank fusion</text>

  <!-- Knowledge graph -->
  <g filter="url(#soft)"><rect x="386" y="240" width="158" height="74" rx="12" fill="#13233c" stroke="url(#amber)" stroke-width="1.5"/></g>
  <g transform="translate(412 172)"></g>
  <circle cx="408" cy="266" r="4" fill="url(#amber)"/><circle cx="426" cy="256" r="4" fill="url(#amber)"/><circle cx="426" cy="278" r="4" fill="url(#amber)"/>
  <g stroke="#5a3d06" stroke-width="2"><path d="M408 266l18-10M408 266l18 12M426 256v22"/></g>
  <text x="442" y="262" fill="#e6edf6" font-size="14" font-weight="600">Knowledge</text>
  <text x="442" y="280" fill="#e6edf6" font-size="14" font-weight="600">graph</text>
  <text x="442" y="298" fill="#8fa6bd" font-size="11">oxigraph + cozo</text>

  <!-- Agent memory -->
  <g filter="url(#soft)"><rect x="560" y="240" width="158" height="74" rx="12" fill="#13233c" stroke="url(#violet)" stroke-width="1.5"/></g>
  <g transform="translate(586 266)" stroke="#2a1a52" stroke-width="2" fill="url(#violet)"><circle cx="0" cy="0" r="11"/><path d="M-5 -2h10M-5 2h10" stroke="#2a1a52"/></g>
  <text x="608" y="258" fill="#e6edf6" font-size="14" font-weight="600">Agent memory</text>
  <text x="608" y="276" fill="#8fa6bd" font-size="11">5 memory types</text>
  <text x="608" y="294" fill="#6b8199" font-size="11">cross-session</text>

  <!-- Agent runtime -->
  <g filter="url(#soft)"><rect x="734" y="240" width="160" height="74" rx="12" fill="#13233c" stroke="url(#rose)" stroke-width="1.5"/></g>
  <g transform="translate(760 266)" fill="url(#rose)"><circle cx="0" cy="-4" r="6"/><path d="M-9 9c0-7 18-7 18 0z"/></g>
  <text x="782" y="258" fill="#e6edf6" font-size="14" font-weight="600">Agent runtime</text>
  <text x="782" y="276" fill="#8fa6bd" font-size="11">planner · specialists</text>
  <text x="782" y="294" fill="#6b8199" font-size="11">verifier · responder</text>

  <!-- internal sub-flow arrows -->
  <g stroke="#7dd3fc" stroke-width="2.4" fill="none" opacity="0.8">
    <path d="M544 183 H560" marker-end="url(#arrow)"/>
    <path d="M718 183 H734" marker-end="url(#arrow)"/>
    <path d="M814 220 V240" marker-end="url(#arrow)"/>
    <path d="M639 220 V240" marker-end="url(#arrow)"/>
    <path d="M465 220 V240" marker-end="url(#arrow)"/>
    <path d="M544 277 H560" marker-end="url(#arrow)"/>
    <path d="M718 277 H734" marker-end="url(#arrow)"/>
  </g>

  <!-- uncertainty band -->
  <g filter="url(#soft)"><rect x="386" y="338" width="508" height="86" rx="14" fill="#101c2f" stroke="#34d399" stroke-opacity="0.55" stroke-width="1.5"/></g>
  <text x="406" y="366" fill="#e6edf6" font-size="15" font-weight="700">Uncertainty &amp; reliability</text>
  <text x="406" y="386" fill="#8fa6bd" font-size="12">typed calibrated confidence · self-consistency · oracle grounding · conformal</text>
  <g font-size="12.5" text-anchor="middle" font-weight="600">
    <rect x="612" y="394" width="84" height="24" rx="12" fill="url(#green)"/><text x="654" y="411" fill="#06311f">accept</text>
    <rect x="704" y="394" width="84" height="24" rx="12" fill="url(#amber)"/><text x="746" y="411" fill="#5a3d06">abstain</text>
    <rect x="796" y="394" width="84" height="24" rx="12" fill="url(#rose)"/><text x="838" y="411" fill="#4a0f1c">escalate</text>
  </g>
  <g stroke="#34d399" stroke-width="2.4" fill="none" opacity="0.85">
    <path d="M814 314 V338" marker-end="url(#arrowg)"/>
  </g>

  <!-- provenance / reproducibility ribbon -->
  <g filter="url(#soft)"><rect x="386" y="442" width="508" height="86" rx="14" fill="#0e1a2c" stroke="#2dd4bf" stroke-opacity="0.3"/></g>
  <text x="640" y="470" fill="#cfe9e4" font-size="13" font-weight="600" text-anchor="middle">Provenance on every claim · content-addressed artifacts · deterministic replay</text>
  <g font-size="11.5" text-anchor="middle" fill="#8fa6bd">
    <rect x="406" y="486" width="120" height="28" rx="8" fill="#13233c"/><text x="466" y="504">model pin</text>
    <rect x="536" y="486" width="130" height="28" rx="8" fill="#13233c"/><text x="601" y="504">data snapshot</text>
    <rect x="676" y="486" width="100" height="28" rx="8" fill="#13233c"/><text x="726" y="504">BLAKE3 CAS</text>
    <rect x="786" y="486" width="92" height="28" rx="8" fill="#13233c"/><text x="832" y="504">audit log</text>
  </g>

  <!-- engine -> outputs arrows -->
  <g stroke="url(#flow)" stroke-width="6" fill="none" opacity="0.9">
    <path d="M918 200 C 960 205, 980 165, 1020 160" marker-end="url(#arrow)"/>
    <path d="M918 280 C 960 285, 980 290, 1020 292" marker-end="url(#arrow)"/>
    <path d="M918 408 C 962 410, 980 430, 1020 432" marker-end="url(#arrow)"/>
  </g>

  <!-- ===================== OUTPUTS ===================== -->
  <text x="1140" y="46" fill="#9fb3c8" font-size="15" letter-spacing="3" text-anchor="middle">OUTPUTS</text>

  <!-- vector DB cylinder -->
  <g filter="url(#soft)" transform="translate(1024 116)">
    <ellipse cx="56" cy="14" rx="56" ry="14" fill="url(#blue)"/>
    <path d="M0 14 V70 a56 14 0 0 0 112 0 V14" fill="#13233c" stroke="#60a5fa" stroke-opacity="0.6"/>
    <ellipse cx="56" cy="14" rx="56" ry="14" fill="none" stroke="#60a5fa" stroke-opacity="0.7"/>
    <text x="56" y="48" fill="#cfe0ff" font-size="13" font-weight="600" text-anchor="middle">Vector DB</text>
    <text x="56" y="66" fill="#8fa6bd" font-size="11" text-anchor="middle">qdrant / lancedb</text>
  </g>

  <!-- graph DB cylinder -->
  <g filter="url(#soft)" transform="translate(1024 248)">
    <ellipse cx="56" cy="14" rx="56" ry="14" fill="url(#amber)"/>
    <path d="M0 14 V70 a56 14 0 0 0 112 0 V14" fill="#13233c" stroke="#fbbf24" stroke-opacity="0.6"/>
    <ellipse cx="56" cy="14" rx="56" ry="14" fill="none" stroke="#fbbf24" stroke-opacity="0.7"/>
    <text x="56" y="48" fill="#ffe9bf" font-size="13" font-weight="600" text-anchor="middle">Knowledge DB</text>
    <text x="56" y="66" fill="#8fa6bd" font-size="11" text-anchor="middle">RDF + evidence</text>
  </g>

  <!-- AI / LLM -->
  <g filter="url(#soft)" transform="translate(1024 384)">
    <rect x="0" y="0" width="112" height="80" rx="14" fill="#13233c" stroke="url(#violet)" stroke-width="1.5"/>
    <g transform="translate(56 30)" fill="url(#violet)">
      <rect x="-16" y="-12" width="32" height="24" rx="6"/>
      <circle cx="-7" cy="0" r="2.6" fill="#1a1140"/><circle cx="7" cy="0" r="2.6" fill="#1a1140"/>
      <path d="M0 -12 v-7" stroke="url(#violet)" stroke-width="2.4"/><circle cx="0" cy="-21" r="3" fill="url(#violet)"/>
      <path d="M-16 -2 h-6 M16 -2 h6" stroke="url(#violet)" stroke-width="2.4"/>
    </g>
    <text x="56" y="60" fill="#e0d8ff" font-size="13" font-weight="600" text-anchor="middle">AI model</text>
    <text x="56" y="74" fill="#8fa6bd" font-size="11" text-anchor="middle">on-prem LLM</text>
  </g>

  <!-- scientist answer -->
  <g filter="url(#soft)" transform="translate(990 500)">
    <rect x="0" y="0" width="250" height="94" rx="14" fill="#0f2030" stroke="url(#green)" stroke-width="1.5"/>
    <g transform="translate(30 47)"><circle cx="0" cy="-12" r="9" fill="url(#green)"/><path d="M-15 16c0-13 30-13 30 0z" fill="url(#green)"/></g>
    <text x="60" y="30" fill="#e6edf6" font-size="13" font-weight="700">Scientist</text>
    <text x="60" y="49" fill="#a7f3d0" font-size="11.5">cited · confidence-scored answer</text>
    <g font-size="10.5" text-anchor="middle" font-weight="600">
      <rect x="60" y="60" width="58" height="20" rx="10" fill="url(#green)"/><text x="89" y="74" fill="#06311f">conf 0.92</text>
      <rect x="124" y="60" width="56" height="20" rx="10" fill="#13233c"/><text x="152" y="74" fill="#8fa6bd">3 refs</text>
      <rect x="186" y="60" width="52" height="20" rx="10" fill="#13233c"/><text x="212" y="74" fill="#8fa6bd">replay</text>
    </g>
  </g>

  <!-- feedback loop engine outputs to scientist -->
  <g stroke="#34d399" stroke-width="3" fill="none" stroke-dasharray="2 7" stroke-linecap="round" opacity="0.8">
    <path d="M1080 464 C 1110 480, 1115 488, 1115 500"/>
  </g>

  <!-- trust boundary -->
  <rect x="22" y="64" width="1170" height="492" rx="22" fill="none" stroke="#2dd4bf" stroke-opacity="0.28" stroke-dasharray="3 8"/>
  <text x="40" y="58" fill="#2dd4bf" font-size="12.5" font-weight="600" opacity="0.85">trust boundary · on-prem / VPC</text>
</svg>

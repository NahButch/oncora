<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" role="img" aria-label="Benchmark harness: agent vs human expert vs baseline scored and gated in CI" font-family="'Segoe UI',system-ui,sans-serif">
  <defs><linearGradient id="eb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f1d33"/><stop offset="1" stop-color="#13233c"/></linearGradient>
  <marker id="ear" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7dd3fc"/></marker></defs>
  <rect width="1200" height="200" rx="14" fill="url(#eb)"/>
  <g transform="translate(40 78)">
    <ellipse cx="55" cy="11" rx="55" ry="11" fill="#3b82f6"/><path d="M0 11 V52 a55 11 0 0 0 110 0 V11" fill="#13233c" stroke="#60a5fa" stroke-opacity="0.6"/>
    <ellipse cx="55" cy="11" rx="55" ry="11" fill="none" stroke="#60a5fa"/><text x="55" y="38" fill="#cfe0ff" font-size="12.5" text-anchor="middle" font-weight="600">Golden set</text>
  </g>
  <g font-size="12.5" text-anchor="middle" font-weight="600">
    <g><rect x="240" y="40" width="170" height="40" rx="11" fill="#13233c" stroke="#2dd4bf"/><text x="325" y="65" fill="#cfe9e4">Oncora agent</text></g>
    <g><rect x="240" y="90" width="170" height="40" rx="11" fill="#13233c" stroke="#fbbf24"/><text x="325" y="115" fill="#ffe9bf">Baseline method</text></g>
    <g><rect x="240" y="140" width="170" height="40" rx="11" fill="#13233c" stroke="#fb7185"/><text x="325" y="165" fill="#ffd6dd">Human expert</text></g>
    <g><rect x="470" y="78" width="150" height="46" rx="12" fill="#13233c" stroke="#34d399"/><text x="545" y="106" fill="#a7f3d0">Scorer</text></g>
  </g>
  <g stroke="#7dd3fc" stroke-width="2" fill="none" opacity="0.8">
    <path d="M150 90 C 200 80, 210 64, 240 60" marker-end="url(#ear)"/>
    <path d="M150 100 C 200 105, 210 108, 240 110" marker-end="url(#ear)"/>
    <path d="M150 110 C 200 130, 210 152, 240 160" marker-end="url(#ear)"/>
    <path d="M410 60 C 440 80, 450 92, 470 98" marker-end="url(#ear)"/>
    <path d="M410 110 C 440 108, 450 104, 470 102" marker-end="url(#ear)"/>
    <path d="M410 160 C 440 130, 450 112, 470 106" marker-end="url(#ear)"/>
    <path d="M620 101 H660" marker-end="url(#ear)"/>
  </g>
  <g font-size="11.5" text-anchor="middle">
    <text x="745" y="36" fill="#9fb3c8" letter-spacing="1">METRICS</text>
    <g fill="#cfe9e4"><rect x="670" y="46" width="150" height="26" rx="8" fill="#0e1a2c" stroke="#2dd4bf" stroke-opacity="0.5"/><text x="745" y="64">accuracy · F1</text>
    <rect x="670" y="78" width="150" height="26" rx="8" fill="#0e1a2c" stroke="#34d399" stroke-opacity="0.5"/><text x="745" y="96">ECE · calibration</text>
    <rect x="670" y="110" width="150" height="26" rx="8" fill="#0e1a2c" stroke="#fbbf24" stroke-opacity="0.5"/><text x="745" y="128">abstention AURC</text>
    <rect x="670" y="142" width="150" height="26" rx="8" fill="#0e1a2c" stroke="#60a5fa" stroke-opacity="0.5"/><text x="745" y="160">latency · cost</text></g>
  </g>
  <g stroke="#7dd3fc" stroke-width="2" fill="none" opacity="0.8"><path d="M820 101 H870" marker-end="url(#ear)"/></g>
  <g><rect x="880" y="62" width="280" height="76" rx="14" fill="#0e1a2c" stroke="#34d399"/>
    <text x="1020" y="92" fill="#a7f3d0" font-size="14" text-anchor="middle" font-weight="700">CI regression gate</text>
    <text x="1020" y="114" fill="#8fa6bd" font-size="11.5" text-anchor="middle">no calibration / accuracy regression</text>
    <text x="1020" y="130" fill="#8fa6bd" font-size="11.5" text-anchor="middle">replay-reproducible numbers</text>
  </g>
</svg>
